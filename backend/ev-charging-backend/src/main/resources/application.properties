spring.application.name=ev-charging-backend

server.port=8080

# Spring Boot does not import .env files automatically. Host development uses
# scripts/start-local.ps1 to export these values; Compose injects its own values.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ev_charging_db}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

jwt.secret=${JWT_SECRET:}
